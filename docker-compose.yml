services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-genai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_genai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - healthcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcare_user} -d ${POSTGRES_DB:-healthcare_genai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthcare_pgdata:

